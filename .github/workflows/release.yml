name: Release

# Ausgelöst durch Veröffentlichung eines GitHub-Releases, z. B.:
#   gh release create v0.1.0 --target main --generate-notes
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Tag liegt auf main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prüfen
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' entspricht nicht vX.Y.Z"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release-Tag '$TAG' zeigt nicht auf einen Commit in main."; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Images veröffentlichen
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: lebensmittelverwaltung-backend
            context: backend
            file: backend/Dockerfile
          - image: lebensmittelverwaltung-web
            context: .
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.verify.outputs.version }}
