name: lebensmittelverwaltung

x-pg-env: &pg-env
  PGHOST: db
  PGUSER: ${POSTGRES_USER:-lmv}
  PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
  PGDATABASE: ${POSTGRES_DB:-lmv}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-lmv}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  backend:
    image: ghcr.io/knuwe1/lebensmittelverwaltung-backend:${LMV_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      LMV_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lmv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lmv}
      LMV_SECRET_KEY: ${LMV_SECRET_KEY:?LMV_SECRET_KEY in .env setzen}
      LMV_BOOTSTRAP_ADMIN_USERNAME: ${LMV_BOOTSTRAP_ADMIN_USERNAME:-}
      LMV_BOOTSTRAP_ADMIN_PASSWORD: ${LMV_BOOTSTRAP_ADMIN_PASSWORD:-}
      LMV_BOOTSTRAP_HOUSEHOLD_NAME: ${LMV_BOOTSTRAP_HOUSEHOLD_NAME:-Mein Haushalt}
      LMV_LOG_LEVEL: ${LMV_LOG_LEVEL:-INFO}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/knuwe1/lebensmittelverwaltung-web:${LMV_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      LMV_SITE_ADDRESS: ${LMV_SITE_ADDRESS:-localhost}
      LMV_TLS_MODE: ${LMV_TLS_MODE:-internal}
      LMV_ACME_EMAIL: ${LMV_ACME_EMAIL:-}
    ports:
      - "${LMV_BIND_ADDRESS:-0.0.0.0}:${LMV_HTTP_PORT:-80}:80"
      - "${LMV_BIND_ADDRESS:-0.0.0.0}:${LMV_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/loop.sh"]
    environment:
      <<: *pg-env
      LMV_BACKUP_TIME: ${LMV_BACKUP_TIME:-03:00}
      LMV_BACKUP_KEEP_DAYS: ${LMV_BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ${LMV_BACKUP_DIR:-./backups}:/backups
      - media:/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  media:
  caddy-data:
  caddy-config:
